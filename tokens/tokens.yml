starting_token_value: 1

tokens:
  keywords:
    control_flow:
      IF: "if"
      WHILE: "while"
      DO: "do"
      ELSE: "else"

    declarations:
      STRUCT: "struct"
      FN: "fn"
      RETURN: "return"
      MUT: "mut"
      IMM: "imm"
      PUB: "pub"

    type_kw:
      I8: "i8"
      U8: "u8"
      I16: "i16"
      U16: "u16"
      I32: "i32"
      U32: "u32"
      I64: "i64"
      U64: "u64"
      I128: "i128"
      U128: "u128"
      F32: "f32"
      F64: "f64"
      BOOL: "bool"
      CHAR: "char"
      VOID: "void"

    misc_flow:
      BREAK: "break"
      CONTINUE: "continue"

    modules:
      IMPORT: "import"
      PACKAGE: "package"
      AS: "as"
      LOAD: "load"

  identifiers:
    IDENTIFIER: "~"

  literals:
    INT_LITERAL: "~"
    FLOAT_LITERAL: "~"
    STRING_LITERAL: "~"
    BOOL_LITERAL: "~"
    CHAR_LITERAL: "~"

  punct:
    delimiters:
      LPAR: "("
      RPAR: ")"
      LBRACK: "["
      RBRACK: "]"
      LCBRA: "{"
      RCBRA: "}"
    separators:
      COMMA: ","
      SMCLN: ";"
      COLON: ":"
      COLONCOLON: "::" #
      TURBOFISH_S: "::<" #
    misc:
      DOT: "."
      ARROW: "->"

  operators:
    AMP: "&"
    INC: "++"
    DEC: "--"
    NEGATION: "!"
    STAR: "*"
    SLASH: "/"
    MODULO: "%"
    PLUS: "+"
    MINUS: "-"
    LESS: "<"
    LEQ: "<="
    GREATER: ">"
    GEQ: ">="
    EQUAL: "=="
    NEQUAL: "!="
    BOOL_AND: "&&"
    BOOL_OR: "||"
    ASSIGN: "="
